name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build zip archive
        run: npm run dist

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath "dist" -Filter "KCC-Workbench-*.zip"
          if (-not $assets) {
            throw "Zip archive was not generated."
          }
          $arguments = @(
            "release", "create", "${{ github.ref_name }}",
            "--repo", "${{ github.repository }}",
            "--title", "KCC Workbench ${{ github.ref_name }}",
            "--generate-notes"
          )
          if ("${{ github.ref_name }}" -match "-(alpha|beta|rc)") {
            $arguments += "--prerelease"
          }
          $arguments += $assets.FullName
          & gh @arguments

