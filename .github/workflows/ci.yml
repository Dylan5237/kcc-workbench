name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows app
        run: npm run build

      - name: Upload unpacked app
        uses: actions/upload-artifact@v4
        with:
          name: kcc-workbench-windows
          path: dist/win-unpacked/
          if-no-files-found: error
          retention-days: 7

