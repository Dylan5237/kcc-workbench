name: Bug 报告
description: 报告一个可复现的问题（Bug Report）
title: "[Bug] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢报告问题。填写前请先搜索 [Issues](https://github.com/Dylan5237/kcc-workbench/issues) 是否已有相同问题。
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你希望看到什么结果。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么，包括完整报错信息。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 从启动应用开始，逐步描述如何复现。
      placeholder: |
        1. 启动应用
        2. 切换到文件查看器
        3. 打开某 Markdown 文件
        4. 观察到...
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: 涉及引擎
      description: 该问题出现在哪个引擎？
      options:
        - Kimi Code
        - CloudCLI（Claude Code）
        - CloudCLI（Codex）
        - 不涉及 / Viewer
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: KCC 版本
      description: 例如 v1.0.0 或 commit hash。
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      description: 例如 Windows 11 24H2。
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js 版本
      description: 运行 `node -v` 查看。
      placeholder: "v22.x.x"
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志
      description: 如有 viewer-context.log 或其他日志，请删除 Cookie、Token、账号、项目源码、git patch、用户名、本机绝对路径与会话标识后再粘贴。
    validations:
      required: false
