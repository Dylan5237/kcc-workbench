<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'self'; base-uri 'none'; form-action 'none'"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文件查看器与任务时间机</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <span class="logo">{ }</span>
      <span class="title">文件查看器</span>
    </div>
    <div class="root-bar">
      <input id="rootInput" list="recentRoots" placeholder="选择要实时监听的项目文件夹…" spellcheck="false" />
      <datalist id="recentRoots"></datalist>
      <button id="browseBtn" title="浏览选择目录">选择文件夹</button>
      <button id="applyRootBtn">打开</button>
    </div>
    <div class="status">
      <span id="liveDot" class="dot"></span>
      <span id="liveText">连接中…</span>
    </div>
  </header>

  <div id="main">
    <aside id="sidebar">
      <div class="sidebar-tabs">
        <button class="active" data-sidebar-mode="files">文件</button>
        <button data-sidebar-mode="artifacts">本轮产物 <span id="artifactCount">0</span></button>
        <button data-sidebar-mode="time-machine">时间机器 <span id="checkpointCount">0</span></button>
      </div>
      <div class="sidebar-head">
        <input id="filterInput" type="text" placeholder="过滤文件名…" />
        <button id="refreshBtn" title="刷新文件树">⟳</button>
      </div>
      <div id="fileTree" class="tree"></div>
      <div id="artifactList" class="artifact-list hidden"></div>
      <div id="timeMachineList" class="time-machine-list hidden"></div>
    </aside>

    <div id="splitter" class="splitter" title="拖拽调整宽度"></div>

    <section id="content">
      <div id="fileHeader" class="file-header hidden">
        <span id="fileName" class="file-name"></span>
        <span id="fileMeta" class="file-meta"></span>
        <span id="updatedBadge" class="badge hidden">已更新</span>
      </div>
      <div id="viewer" class="viewer">
        <div class="empty-hint">
          <p>← 从左侧选择一个 <code>.md</code>、<code>.json</code> 或 <code>.html</code> 文件</p>
          <p class="sub">文件修改后会自动刷新</p>
        </div>
      </div>
    </section>
  </div>

  <div id="forkModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="forkTitle">
    <form id="forkForm" class="modal-box fork-modal-box">
      <div class="modal-head">
        <span id="forkTitle">从此时间点继续</span>
        <button id="forkClose" type="button" title="关闭" aria-label="关闭">✕</button>
      </div>
      <div class="fork-body">
        <div class="fork-safety">
          <strong>创建隔离 Git worktree</strong>
          <span>当前项目和分支不会被覆盖；系统会在新目录恢复这个时间点。</span>
        </div>
        <label for="forkBranch">新分支名称</label>
        <input id="forkBranch" required spellcheck="false" />
        <small>支持字母、数字、点、横线、下划线和斜杠。</small>
        <label for="forkTarget">目标目录（可选）</label>
        <input id="forkTarget" spellcheck="false" placeholder="留空则创建在当前仓库旁边" />
        <div id="forkError" class="fork-error hidden" role="alert"></div>
      </div>
      <div class="modal-foot">
        <span class="picker-current">仅在确认后执行 Git 操作</span>
        <button id="forkCancel" type="button">取消</button>
        <button id="forkSubmit" class="primary" type="submit">创建并恢复</button>
      </div>
    </form>
  </div>

  <div id="pickerModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <span>选择监听目录</span>
        <button id="pickerClose" title="关闭">✕</button>
      </div>
      <div class="picker-crumb" id="pickerCrumb"></div>
      <div class="picker-list" id="pickerList"></div>
      <div class="modal-foot">
        <span id="pickerCurrent" class="picker-current" title=""></span>
        <button id="pickerSelect" class="primary">选择此目录</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/mermaid.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
