<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self' app:; script-src 'self' app:; style-src 'self' app:; img-src 'self' app: data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
  >
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arckeep</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <header class="titlebar">
    <button id="engineToggle" class="brand" type="button" title="切换到 CloudCLI（Alt+Q）" aria-label="切换 AI 引擎">
      <img
        class="brand-mark"
        src="assets/arckeep-app-icon.png"
        alt=""
        aria-hidden="true"
      >
      <span class="brand-name">Arckeep</span>
      <span id="brandEngine" class="brand-engine">Kimi</span>
    </button>

    <nav class="tab-strip" aria-label="主工作区">
      <button class="workspace-tab active" type="button" data-tab="kimi">
        <span class="tab-icon">⌂</span>
        <span>首页</span>
      </button>
      <button class="workspace-tab" type="button" data-tab="viewer">
        <span class="tab-icon">{ }</span>
        <span>文件</span>
      </button>
      <button class="workspace-tab" type="button" data-tab="settings">
        <span class="tab-icon">⚙</span>
        <span>设置</span>
      </button>
    </nav>

    <div class="titlebar-actions">
      <button id="dogfoodBtn" class="icon-btn" type="button" title="Dogfood 记录（Ctrl+Shift+N）" aria-label="Dogfood 记录" aria-expanded="false">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="3" y="1.5" width="10" height="13" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
          <line x1="5.5" y1="5" x2="10.5" y2="5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="5.5" y1="8" x2="10.5" y2="8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="5.5" y1="11" x2="8.5" y2="11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="restartKimiBtn" class="icon-btn restart-btn kimi-only" type="button" title="重启首页" aria-label="重启首页" hidden>↻</button>
      <button id="quotaButton" class="quota-pill kimi-only" type="button" aria-expanded="false" hidden>
        <span id="quotaStatusDot" class="status-dot status-insufficient"></span>
        <span class="quota-label">额度</span>
        <strong id="quotaPercent">--</strong>
        <span class="chevron">⌄</span>
      </button>
    </div>
  </header>
  <script src="shell.js"></script>
</body>
</html>
