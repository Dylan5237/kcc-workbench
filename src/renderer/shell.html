<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self' app:; script-src 'self' app:; style-src 'self' app:; img-src 'self' app: data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
  >
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kimi Desktop</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand">
      <img
        class="brand-mark"
        src="assets/kimi-code-logo.png"
        alt=""
        aria-hidden="true"
      >
      <span class="brand-name">Kimi Desktop</span>
    </div>

    <nav class="tab-strip" aria-label="主工作区">
      <button class="workspace-tab active" type="button" data-tab="kimi">
        <span class="tab-icon">⌂</span>
        <span>首页</span>
      </button>
      <button class="workspace-tab" type="button" data-tab="viewer">
        <span class="tab-icon">{ }</span>
        <span>文件查看器</span>
      </button>
      <button class="workspace-tab" type="button" data-tab="settings">
        <span class="tab-icon">⚙</span>
        <span>系统设置</span>
      </button>
    </nav>

    <button id="quotaButton" class="quota-pill" type="button" aria-expanded="false">
      <span id="quotaStatusDot" class="status-dot status-insufficient"></span>
      <span class="quota-label">额度</span>
      <strong id="quotaPercent">--</strong>
      <span class="chevron">⌄</span>
    </button>
  </header>
  <script src="shell.js"></script>
</body>
</html>
