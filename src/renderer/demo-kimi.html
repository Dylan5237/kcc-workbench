<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self' app:; style-src 'self' app:; img-src 'self' app: data:; object-src 'none'"
  >
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kimi</title>
  <style>
    * { box-sizing: border-box; }
    body {
      display: grid;
      grid-template-columns: 220px 1fr;
      height: 100vh;
      margin: 0;
      color: #252525;
      font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
      background: #fff;
    }
    aside {
      padding: 18px 14px;
      background: #f7f7f7;
      border-right: 1px solid #ececec;
    }
    .new {
      width: 100%;
      padding: 10px;
      margin-bottom: 18px;
      font-weight: 600;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 9px;
    }
    .item { padding: 9px 10px; color: #666; font-size: 13px; border-radius: 7px; }
    .item.active { color: #222; background: #e9e9e9; }
    main { display: grid; place-items: center; padding: 40px; }
    .welcome { width: min(680px, 86%); text-align: center; }
    h1 { margin: 0 0 12px; font-size: 29px; }
    p { margin: 0 0 28px; color: #777; }
    .composer {
      min-height: 92px;
      padding: 16px;
      text-align: left;
      color: #aaa;
      border: 1px solid #dcdcdc;
      border-radius: 14px;
      box-shadow: 0 8px 28px rgb(0 0 0 / 5%);
    }
  </style>
</head>
<body>
  <aside>
    <button class="new">＋ 新建会话</button>
    <div class="item active">今天</div>
    <div class="item">Electron 桌面封装方案</div>
    <div class="item">额度预测设计</div>
  </aside>
  <main>
    <section class="welcome">
      <h1>你好，我是 Kimi</h1>
      <p>这是用于验证桌面外壳、标题栏和额度组件的离线预览页面。</p>
      <div class="composer">给 Kimi 发送消息…</div>
    </section>
  </main>
</body>
</html>
